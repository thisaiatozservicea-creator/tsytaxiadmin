<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffc400">
<title>Admin Dashboard | TSY TAXI</title>
<style>
:root{--yellow:#ffc400;--ink:#111;--muted:#777;--green:#16834a;--red:#e34c38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
body{min-height:100svh;background:#f5f5f5}

.topbar{min-height:68px;background:#111;color:#fff;border-bottom:4px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:43px;height:43px;border-radius:50%;object-fit:contain;background:#fff;padding:2px}
.brand strong{display:block;font-size:18px;font-weight:950;letter-spacing:1.3px}
.brand small{display:block;color:var(--yellow);font-size:9px;letter-spacing:2px;font-weight:800;margin-top:4px}
.admin-badge{background:#ff4444;color:#fff;font-size:10px;padding:6px 12px;border-radius:20px;font-weight:900}

main{max-width:1200px;margin:0 auto;padding:20px}
.header{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px #0001}
.header h1{font-size:24px;margin-bottom:8px}
.header p{color:var(--muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}
.stat-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.stat-value{font-size:32px;font-weight:950;margin:8px 0}
.stat-card.pending .stat-value{color:#ff9800}
.stat-card.confirmed .stat-value{color:var(--green)}
.stat-card.total .stat-value{color:var(--ink)}

.bookings-container{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px #0001;margin-bottom:20px}
.bookings-title{font-size:18px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.bookings-title:hover{color:var(--yellow)}
.bookings-title .toggle-icon{margin-right:8px;transition:transform 0.2s;display:inline-block}
.bookings-title .toggle-icon.collapsed{transform:rotate(-90deg)}
.title-buttons{display:flex;gap:8px}
.section-content{transition:max-height 0.3s ease;overflow:hidden}
.section-content.collapsed{max-height:0 !important}
.refresh-btn{background:var(--yellow);border:0;padding:8px 16px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer}
.refresh-btn:hover{background:#d49c00}
.delete-all-btn{background:var(--red);color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer}
.delete-all-btn:hover{background:#b81c1c}

.booking-card{background:#f9f9f9;border:2px solid #e9e9e9;border-radius:12px;padding:16px;margin-bottom:12px}
.booking-card.pending{border-color:#ff9800}
.booking-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.booking-id{font-size:14px;font-weight:900;color:var(--ink)}
.booking-status{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:900}
.booking-status.pending{background:#fff3e0;color:#ff9800}
.booking-status.confirmed{background:#e8f5e9;color:var(--green)}
.booking-status.assigned{background:#e3f2fd;color:#2196f3}
.booking-status.accepted{background:#e8f5e9;color:var(--green)}
.booking-status.in_progress{background:#fff3e0;color:#ff9800}
.booking-status.completed{background:#e8f5e9;color:var(--green)}
.booking-status.cancelled{background:#ffebee;color:var(--red)}
.booking-status.rejected{background:#ffebee;color:var(--red)}

.booking-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.detail-item{font-size:13px}
.detail-label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:4px}
.detail-value{font-weight:700;color:var(--ink)}

.booking-route{background:#fff;padding:12px;border-radius:8px;margin-bottom:12px}
.route-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.route-row:last-child{margin-bottom:0}
.route-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.route-dot.pickup{background:var(--green)}
.route-dot.drop{background:var(--red)}

.booking-actions{display:flex;gap:8px}
.btn-confirm{background:var(--green);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer;flex:1}
.btn-confirm:hover{background:#0e5a32}
.btn-reject{background:#ff4444;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:900;font-size:12px;cursor:pointer;flex:1}
.btn-reject:hover{background:#cc0000}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:12px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.modal-header{background:#111;color:#fff;padding:20px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:18px;margin:0}
.modal-close{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.modal-close:hover{background:rgba(255,255,255,0.1)}
.modal-body{padding:20px}
.partner-item{background:#f9f9f9;border:2px solid #e9e9e9;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.2s}
.partner-item:hover{border-color:var(--yellow);background:#fff}
.partner-item-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.partner-item-name{font-size:16px;font-weight:900}
.partner-distance{background:#e8f5e9;color:var(--green);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:900}
.partner-item-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.partner-item-detail{color:var(--muted)}
.partner-item-detail strong{color:var(--ink)}
.btn-assign{background:var(--yellow);color:var(--ink);border:0;padding:10px;border-radius:8px;font-weight:900;font-size:12px;width:100%;margin-top:12px;cursor:pointer}
.btn-assign:hover{background:#d49c00}
.btn-cancel-booking{background:#ff4444;color:#fff}

.partner-card{background:#e8f5e9;border:2px solid var(--green);border-radius:12px;padding:16px;margin-bottom:12px}
.partner-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.partner-name{font-size:16px;font-weight:900;color:var(--ink)}
.online-badge{background:var(--green);color:#fff;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:900}
.partner-details{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.partner-detail{font-size:13px}
.partner-label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:4px}
.partner-value{font-weight:700;color:var(--ink)}

@media(max-width:768px){
  main{padding:12px}
  .topbar{padding:0 12px;min-height:56px}
  .brand img{width:36px;height:36px}
  .brand strong{font-size:16px}
  .brand small{font-size:8px}
  .admin-badge{font-size:9px;padding:4px 10px}

  .header{padding:16px;margin-bottom:16px}
  .header h1{font-size:20px}
  .header p{font-size:12px}

  .stats{grid-template-columns:1fr;gap:12px;margin-bottom:16px}
  .stat-card{padding:14px}
  .stat-label{font-size:11px}
  .stat-value{font-size:26px}

  .bookings-container{padding:16px;margin-bottom:16px}
  .bookings-title{font-size:16px;margin-bottom:12px;flex-direction:column;align-items:start;gap:12px}
  .bookings-title > div{width:100%}
  .title-buttons{width:100%;justify-content:space-between;margin-top:8px}
  .refresh-btn,.delete-all-btn{padding:6px 12px;font-size:11px;flex:1}
  .toggle-icon{font-size:14px}

  .booking-card{padding:12px;margin-bottom:10px}
  .booking-id{font-size:13px}
  .booking-status{padding:3px 10px;font-size:10px}
  .booking-details{grid-template-columns:1fr;gap:10px;margin-bottom:10px}
  .detail-item{font-size:12px}
  .detail-label{font-size:9px}
  .detail-value{font-size:13px}
  .booking-route{padding:10px;margin-bottom:10px}
  .route-row{font-size:11px;margin-bottom:6px}
  .route-dot{width:10px;height:10px}
  .booking-actions{gap:6px}
  .btn-confirm,.btn-reject{padding:8px 12px;font-size:11px}

  .partner-card{padding:12px;margin-bottom:10px}
  .partner-name{font-size:14px}
  .partner-details{grid-template-columns:1fr}
  .partner-detail{font-size:12px}
  .partner-label{font-size:9px}

  .modal{padding:12px}
  .modal-content{max-height:90vh}
  .modal-header{padding:16px}
  .modal-header h2{font-size:16px}
  .modal-body{padding:16px}
  .partner-item{padding:12px}
  .partner-item-name{font-size:14px}
  .partner-item-details{grid-template-columns:1fr;font-size:12px}
}
</style>
</head>

  <div class="brand">
    <img src="logo.jpeg" alt="TSY Taxi logo">
    <div><strong>TSY TAXI</strong><small>ADMIN DASHBOARD</small></div>

<main>
  <div class="header">
    <h1>Booking Dashboard</h1>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Partners database (different project)
const partnersConfig = {

  authDomain: "tsytaxi-7e9b0.firebaseapp.com",
  projectId: "tsytaxi-7e9b0",
  storageBucket: "tsytaxi-7e9b0.firebasestorage.app",
  messagingSenderId: "37450943469",
  appId: "1:37450943469:web:4b9208836bb01c715835e4"
};
const partnersApp = initializeApp(partnersConfig, "partnersApp");
const partnersDb = getFirestore(partnersApp);

const bookingsList = document.getElementById("bookingsList");
const partnersList = document.getElementById("partnersList");
const onlineCount = document.getElementById("onlineCount");
const refreshBtn = document.getElementById("refreshBtn");

let allBookings = [];
let allPartners = [];
let addressCache = {}; // Cache addresses by "lat,lon"

// Toggle section visibility
window.toggleSection = function(sectionName, event) {
  if (event) event.stopPropagation();

  const content = document.getElementById(sectionName === 'partners' ? 'partnersList' : 'bookingsList');
  const toggle = document.getElementById(sectionName === 'partners' ? 'partnersToggle' : 'bookingsToggle');

  if (content.classList.contains('collapsed')) {
    content.classList.remove('collapsed');
    content.style.maxHeight = content.scrollHeight + 'px';
    toggle.classList.remove('collapsed');
  } else {
    content.classList.add('collapsed');
    content.style.maxHeight = '0';
    toggle.classList.add('collapsed');
  }
};

function formatDateTime(isoString) {
  const date = new Date(isoString);
  return date.toLocaleString('en-IN', {
    day: '2-digit',
    month: 'short',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function renderBookings() {
  if (allBookings.length === 0) {
    bookingsList.innerHTML = '<div class="empty-state">No bookings yet</div>';
    return;
  }

  bookingsList.innerHTML = allBookings.map(booking => {
    // Calculate time remaining for PENDING bookings
    let timeoutWarning = '';
    if (booking.status === 'PENDING' && booking.createdAt) {
      const createdTime = new Date(booking.createdAt);
      const now = new Date();
      const minutesElapsed = (now - createdTime) / 1000 / 60;
      const minutesRemaining = Math.max(0, 5 - minutesElapsed);

      if (minutesRemaining > 0) {
        const mins = Math.floor(minutesRemaining);
        const secs = Math.floor((minutesRemaining - mins) * 60);
        timeoutWarning = `<div style="background:#fff3e0;border-left:4px solid #ff9800;padding:8px 12px;margin-bottom:12px;border-radius:6px;font-size:12px;color:#ff9800;font-weight:700">⏱ Auto-delete in ${mins}m ${secs}s</div>`;
      }
    }

    return `
    <div class="booking-card ${booking.status.toLowerCase()}">
      <div class="booking-header">
        <div>
          <div class="booking-id">${booking.bookingId}</div>
          <div style="font-size:11px;color:#777;margin-top:4px">${formatDateTime(booking.createdAt)}</div>
        </div>
        <div class="booking-status ${booking.status.toLowerCase()}">${booking.status}</div>
      </div>
      ${timeoutWarning}

      <div class="booking-details">
        <div class="detail-item">
          <div class="detail-label">Passenger</div>
          <div class="detail-value">${booking.passenger.name}</div>
          <div style="font-size:11px;color:#666;margin-top:2px">${booking.passenger.phone}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Fare</div>
          <div class="detail-value" style="font-size:20px;color:#ffc400">₹${booking.fare.toFixed(2)}</div>
          <div style="font-size:11px;color:#666;margin-top:2px">${booking.distanceKm.toFixed(2)} km</div>
        </div>
      </div>

      <div class="booking-route">
        <div class="route-row">
          <div class="route-dot pickup"></div>
          <div><strong>Pickup:</strong> ${booking.pickup.area || booking.pickup.displayName}</div>
        </div>
        <div class="route-row">
          <div class="route-dot drop"></div>
          <div><strong>Drop:</strong> ${booking.destination.area || booking.destination.displayName}</div>
        </div>
      </div>

      ${booking.partnerName ? `
        <div class="partner-card" style="background:#e3f2fd;border:2px solid #2196f3;border-radius:12px;padding:12px;margin:12px 0">
          <div style="font-size:13px;font-weight:900;margin-bottom:8px;color:#2196f3">👤 Assigned Partner</div>
          <div style="font-size:12px;margin:4px 0"><strong>Name:</strong> ${booking.partnerName}</div>
          <div style="font-size:12px;margin:4px 0"><strong>Phone:</strong> ${booking.partnerPhone || '-'}</div>
          <div style="font-size:12px;margin:4px 0"><strong>Vehicle:</strong> ${booking.partnerVehicle || '-'}</div>
          <div style="font-size:12px;margin:4px 0"><strong>Status:</strong> <span class="booking-status ${booking.status.toLowerCase()}">${booking.status}</span></div>
        </div>
      ` : ''}

      ${booking.status === 'PENDING' ? `
        <div class="booking-actions">
          <button class="btn-reject btn-cancel-booking" onclick="cancelBooking('${booking.id}', '${booking.bookingId}')">✗ CANCEL</button>
          <button class="btn-confirm" onclick="openAssignModal('${booking.id}', ${JSON.stringify(booking).replace(/"/g, '&quot;')})">👤 ASSIGN PARTNER</button>
        </div>
      ` : booking.status === 'ASSIGNED' ? (() => {
        const assignedTime = new Date(booking.assignedAt);
        const now = new Date();
        const secondsElapsed = (now - assignedTime) / 1000;
        const secondsRemaining = Math.max(0, 90 - secondsElapsed);

        if (secondsRemaining > 0) {
          const mins = Math.floor(secondsRemaining / 60);
          const secs = Math.floor(secondsRemaining % 60);
          return `
            <div style="background:#fff3e0;border:2px solid #ff9800;border-radius:8px;padding:12px;margin-top:12px;text-align:center">
              <div style="font-size:12px;color:#ff9800;font-weight:900">⏳ Waiting for partner to accept...</div>
              <div style="font-size:11px;color:#666;margin-top:4px">Timeout in ${mins}m ${secs}s</div>
            </div>
          `;
        } else {
          return `
            <div style="background:#ffebee;border:2px solid var(--red);border-radius:8px;padding:12px;margin-top:12px">
              <div style="font-size:12px;color:var(--red);font-weight:900;margin-bottom:12px">⚠️ Partner has not responded</div>
              <div class="booking-actions">
                <button class="btn-reject btn-cancel-booking" onclick="cancelBooking('${booking.id}', '${booking.bookingId}')">✗ CANCEL</button>
                <button class="btn-confirm" onclick="openAssignModal('${booking.id}', ${JSON.stringify(booking).replace(/"/g, '&quot;')})">🔄 REASSIGN</button>
              </div>
            </div>
          `;
        }
      })() : booking.status === 'ACCEPTED' ? `
        <div style="background:#e8f5e9;border:2px solid var(--green);border-radius:8px;padding:12px;margin-top:12px;text-align:center">
          <div style="font-size:12px;color:var(--green);font-weight:900">✅ Partner accepted - Trip starting soon</div>
        </div>
      ` : booking.status === 'IN_PROGRESS' ? `
        <div style="background:#fff3e0;border:2px solid #ff9800;border-radius:8px;padding:12px;margin-top:12px;text-align:center">
          <div style="font-size:12px;color:#ff9800;font-weight:900">🚗 Trip in progress...</div>
        </div>
      ` : booking.status === 'COMPLETED' ? `
        <div style="background:#e8f5e9;border:2px solid var(--green);border-radius:8px;padding:12px;margin-top:12px;text-align:center">
          <div style="font-size:12px;color:var(--green);font-weight:900">✅ Trip completed successfully</div>
        </div>
      ` : booking.status === 'CANCELLED' ? `
        <div style="background:#ffebee;border:2px solid var(--red);border-radius:8px;padding:12px;margin-top:12px;text-align:center">
          <div style="font-size:12px;color:var(--red);font-weight:900">❌ Booking cancelled</div>
        </div>
      ` : booking.status === 'REJECTED' ? `
        <div style="background:#ffebee;border:2px solid var(--red);border-radius:8px;padding:12px;margin-top:12px;text-align:center">
          <div style="font-size:12px;color:var(--red);font-weight:900">❌ Partner rejected</div>
        </div>
      ` : ''}
    </div>
    `;
  }).join('');
}

function updateStats() {
  const pending = allBookings.filter(b => b.status === 'PENDING').length;
  const confirmed = allBookings.filter(b => b.status === 'CONFIRMED').length;

  statPending.textContent = pending;
  statConfirmed.textContent = confirmed;
  statTotal.textContent = allBookings.length;
}

// Reverse geocode coordinates to address
async function getAddressFromCoords(lat, lon) {
  // Round to 4 decimal places (~11m accuracy) for cache key
  const cacheKey = `${lat.toFixed(4)},${lon.toFixed(4)}`;

  // Return cached address if available
  if (addressCache[cacheKey]) {
    return addressCache[cacheKey];
  }

  try {
    const response = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,
      {
        headers: {
          'User-Agent': 'TSY-TAXI-Admin'
        }
      }
    );
    const data = await response.json();

    if (data && data.display_name) {
      // Format: area, city, state
      const addr = data.address || {};
      const parts = [
        addr.road || addr.suburb || addr.neighbourhood,
        addr.city || addr.town || addr.village,
        addr.state
      ].filter(Boolean);
      const address = parts.join(', ') || data.display_name;

      // Cache the result
      addressCache[cacheKey] = address;
      return address;
    }
    return null;
  } catch (error) {
    console.error('Geocode error:', error);
    return null;
  }
}

// Render partners
async function renderPartners() {
  const onlinePartners = allPartners.filter(p => p.isOnline && p.active !== false);
  onlineCount.textContent = onlinePartners.length;
  document.getElementById('totalPartners').textContent = allPartners.length;

  if (onlinePartners.length === 0) {
    partnersList.innerHTML = '<div class="empty-state">No partners online</div>';
    return;
  }

  // Fetch addresses for partners with location (in parallel)
  const addressPromises = onlinePartners
    .filter(p => p.currentLocation)
    .map(async p => {
      const address = await getAddressFromCoords(
        p.currentLocation.latitude,
        p.currentLocation.longitude
      );
      if (address) {
        p.locationAddress = address;
      }
    });

  await Promise.all(addressPromises);

  partnersList.innerHTML = onlinePartners.map(p => {
    const onlineMinutes = p.onlineStartTime
      ? Math.floor((Date.now() - p.onlineStartTime) / 60000)
      : 0;
    const hours = Math.floor(onlineMinutes / 60);
    const mins = onlineMinutes % 60;
    const duration = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

    const isOnTrip = p.hasActiveBooking === true;
    const statusBadge = isOnTrip
      ? `<div class="online-badge" style="background:#fff3e0;color:#ff9800">🚗 ON TRIP</div>`
      : `<div class="online-badge">● ONLINE ${duration}</div>`;

    return `
    <div class="partner-card" style="${isOnTrip ? 'background:#fff8e1;border-color:#ffc400' : ''}">
      <div class="partner-header">
        <div class="partner-name">${p.name || "Partner"}</div>
        ${statusBadge}
      </div>
      <div class="partner-details">
        <div class="partner-detail">
          <div class="partner-label">Partner ID</div>
          <div class="partner-value">${p.partnerId || p.id}</div>
        </div>
        <div class="partner-detail">
          <div class="partner-label">Phone</div>
          <div class="partner-value">${p.phone || "N/A"}</div>
        </div>
        ${p.email ? `<div class="partner-detail">
          <div class="partner-label">Email</div>
          <div class="partner-value">${p.email}</div>
        </div>` : ''}
        <div class="partner-detail">
          <div class="partner-label">Vehicle</div>
          <div class="partner-value">${p.vehicleNumber || "N/A"}</div>
        </div>
        <div class="partner-detail">
          <div class="partner-label">Status</div>
          <div class="partner-value" style="color:${p.active ? 'var(--green)' : 'var(--red)'}">
            ${p.active ? 'Active' : 'Inactive'}
          </div>
        </div>
        ${p.currentLocation ? `<div class="partner-detail" style="grid-column:1/-1">
          <div class="partner-label">📍 Current Location</div>
          <div class="partner-value" style="font-size:11px;line-height:1.4">
            ${p.locationAddress || 'Loading address...'}
            <br><small style="color:#888">${p.currentLocation.latitude.toFixed(6)}, ${p.currentLocation.longitude.toFixed(6)} • ±${Math.round(p.currentLocation.accuracy)}m</small>
          </div>
        </div>` : ''}
      </div>
    </div>
  `}).join('');
}

// Update booking count
function updateBookingCount() {
  const bookingCount = document.getElementById("bookingCount");
  if (bookingCount) {
    bookingCount.textContent = allBookings.length;

}

// Real-time listener for bookings
const bookingsRef = collection(db, "bookings");
const q = query(bookingsRef, orderBy("createdAt", "desc"));

onSnapshot(q, async (snapshot) => {
  allBookings = [];
  const deletePromises = [];

  snapshot.forEach((docSnapshot) => {
    const booking = { id: docSnapshot.id, ...docSnapshot.data() };

    // Filter: Only show active bookings (not completed/cancelled)
    if (booking.status !== 'COMPLETED' && booking.status !== 'CANCELLED' && booking.status !== 'REJECTED') {
      allBookings.push(booking);
    }
  });

  // Execute all deletions
  if (deletePromises.length > 0) {
    try {
      await Promise.all(deletePromises);
      console.log(`✓ Auto-deleted ${deletePromises.length} booking(s)`);
    } catch (error) {
      console.error("Auto-delete error:", error);
    }
  }

  renderBookings();
  updateBookingCount();

  // Set max-height for smooth collapse
  const bookingsList = document.getElementById('bookingsList');
  if (!bookingsList.classList.contains('collapsed')) {
    bookingsList.style.maxHeight = bookingsList.scrollHeight + 'px';
  }

  console.log("✓ Loaded", allBookings.length, "active bookings");
});

// Calculate distance between two coordinates (Haversine formula)
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371; // Earth radius in km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c; // Distance in km
}

// Open assign partner modal
let currentBookingForAssignment = null;

window.openAssignModal = function(bookingId, bookingData) {
  currentBookingForAssignment = { id: bookingId, data: bookingData };

  const modal = document.getElementById("assignModal");
  const modalList = document.getElementById("partnerModalList");

  modal.classList.add("show");
  modalList.innerHTML = '<div class="loading">Loading online partners...</div>';

  // Get online partners and calculate distances (exclude partners already on a trip)
  const onlinePartners = allPartners.filter(p =>
    p.isOnline &&
    p.active &&
    p.currentLocation &&
    !p.hasActiveBooking
  );

  if (onlinePartners.length === 0) {
    modalList.innerHTML = '<div class="empty-state">No available partners online. All partners are either offline or currently on a trip.</div>';
    return;
  }

  // Calculate distances and add to partner objects
  const pickupLat = bookingData.pickup.lat;
  const pickupLon = bookingData.pickup.lon;

  const partnersWithDistance = onlinePartners.map(p => ({
    ...p,
    distanceKm: calculateDistance(
      pickupLat,
      pickupLon,
      p.currentLocation.latitude,
      p.currentLocation.longitude
    )
  }));

  // Sort by: 1) Distance (nearest first), 2) Online time (earliest first)
  partnersWithDistance.sort((a, b) => {
    if (Math.abs(a.distanceKm - b.distanceKm) > 0.5) {
      return a.distanceKm - b.distanceKm; // Nearest first
    }
    // If within 500m, prioritize who logged in first
    return (a.onlineStartTime || 0) - (b.onlineStartTime || 0);
  });

  // Render partners list
  modalList.innerHTML = partnersWithDistance.map(p => `
    <div class="partner-item" onclick="assignPartnerToBooking('${p.id}', ${JSON.stringify({
      partnerId: p.partnerId,
      name: p.name,
      phone: p.phone,
      vehicleNumber: p.vehicleNumber
    }).replace(/"/g, '&quot;')})">
      <div class="partner-item-header">
        <div class="partner-item-name">${p.name || 'Partner'}</div>
        <div class="partner-distance">📍 ${p.distanceKm.toFixed(1)} km</div>
      </div>
      <div class="partner-item-details">
        <div class="partner-item-detail"><strong>ID:</strong> ${p.partnerId}</div>
        <div class="partner-item-detail"><strong>Phone:</strong> ${p.phone || 'N/A'}</div>
        <div class="partner-item-detail"><strong>Vehicle:</strong> ${p.vehicleNumber || 'N/A'}</div>
        <div class="partner-item-detail"><strong>Online:</strong> ${Math.floor((Date.now() - (p.onlineStartTime || 0)) / 60000)}m</div>
      </div>
      <button class="btn-assign">✓ ASSIGN THIS PARTNER</button>
    </div>
  `).join('');
};

// Assign partner to booking
window.assignPartnerToBooking = async function(partnerDocId, partnerData) {
  if (!currentBookingForAssignment) return;

  const modal = document.getElementById("assignModal");

  try {
    // Get current booking to check if reassigning
    const bookingData = currentBookingForAssignment.data;

    // If reassigning (booking already has a partner), clear old partner's flag
    if (bookingData.partnerId) {
      const oldPartner = allPartners.find(p => p.partnerId === bookingData.partnerId);
      if (oldPartner) {
        await updateDoc(doc(partnersDb, "partners", oldPartner.id), {
          hasActiveBooking: false,
          activeBookingId: null
        });
        console.log("✓ Cleared old partner's active booking flag");
      }
    }

    // Assign new partner to booking
    await updateDoc(doc(db, "bookings", currentBookingForAssignment.id), {
      status: "ASSIGNED",
      assignedAt: new Date().toISOString(),
      partnerId: partnerData.partnerId,
      partnerName: partnerData.name,
      partnerPhone: partnerData.phone,
      partnerVehicle: partnerData.vehicleNumber
    });

    console.log("✓ Partner assigned to booking");
    alert("✓ Partner assigned successfully!");
    modal.classList.remove("show");
    currentBookingForAssignment = null;
  } catch (error) {
    console.error("Assignment error:", error);
    alert("Failed to assign partner: " + error.message);
  }
};

document.getElementById("closeModal").addEventListener("click", () => {

  currentBookingForAssignment = null;
});

document.getElementById("assignModal").addEventListener("click", (e) => {
  if (e.target.id === "assignModal") {
    document.getElementById("assignModal").classList.remove("show");
    currentBookingForAssignment = null;
  }
});

// DELETE ALL BOOKINGS
const deleteAllBtn = document.getElementById("deleteAllBtn");
const bookingCount = document.getElementById("bookingCount");

deleteAllBtn.addEventListener("click", async () => {
  const count = allBookings.length;

  if (count === 0) {
    alert("No bookings to delete.");
    return;
  }

  const confirmation = confirm(
    `⚠️ WARNING: DELETE ALL BOOKINGS\n\n` +
    `This will permanently delete ALL ${count} bookings from the database.\n\n` +
    `This action CANNOT be undone!\n\n` +
    `Type "DELETE" in the next prompt to confirm.`
  );

  if (!confirmation) return;

  const confirmText = prompt(`Type "DELETE" to confirm deletion of ${count} bookings:`);

  if (confirmText !== "DELETE") {
    alert("Deletion cancelled. Text did not match.");
    return;
  }

  deleteAllBtn.disabled = true;
  deleteAllBtn.textContent = "DELETING...";

  try {
    const snapshot = await getDocs(collection(db, "bookings"));
    const deletePromises = [];

    snapshot.forEach((docSnapshot) => {
      deletePromises.push(deleteDoc(doc(db, "bookings", docSnapshot.id)));
    });

    await Promise.all(deletePromises);

    alert(`✓ Successfully deleted ${deletePromises.length} bookings.`);
    console.log(`✓ Deleted ${deletePromises.length} bookings`);

  } catch (error) {
    console.error("Delete error:", error);
    alert("❌ Error deleting bookings: " + error.message);
  } finally {
    deleteAllBtn.disabled = false;
    deleteAllBtn.textContent = "🗑️ DELETE ALL";
  }
});
</script>
